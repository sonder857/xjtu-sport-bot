name: XJTU Sport Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xjtu-sport-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pycryptodome beautifulsoup4

      - name: Run sport bot
        env:
          XJTU_USER: ${{ secrets.XJTU_USER }}
          XJTU_PASSWORD: ${{ secrets.XJTU_PASSWORD }}
        run: python sport_bot.py
